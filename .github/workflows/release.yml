name: Release and deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site contract
        run: python3 scripts/validate_site.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA"
          tar -czf - site nginx docker-compose.yml | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; target=/opt/projects/2br_land/releases/$release_id; mkdir -p \"\$target\"; tar -xzf - -C \"\$target\""

      - name: Activate and verify release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; target=/opt/projects/2br_land/releases/$release_id; docker compose -f \"\$target/docker-compose.yml\" config --quiet; docker compose -f \"\$target/docker-compose.yml\" up -d --force-recreate --remove-orphans; for attempt in \$(seq 1 20); do curl --fail --silent http://127.0.0.1:8460/healthz && break; test \"\$attempt\" -lt 20; sleep 2; done; curl --fail --silent https://2brain.pro/ >/dev/null; ln -sfn \"\$target\" /opt/projects/2br_land/releases/current"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes

# Managed by /opt/projects/2br_land/install-host.sh
server {
    listen 80;
    listen [::]:80;
    server_name 2brain.pro www.2brain.pro;

    access_log /var/log/nginx/2brain.pro.access.log;
    error_log /var/log/nginx/2brain.pro.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://2brain.pro$request_uri;
    }
}

server {
    listen 127.0.0.1:10444 ssl http2;
    listen [::1]:10444 ssl http2;
    server_name 2brain.pro;

    ssl_certificate /etc/letsencrypt/live/2brain.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2brain.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/2brain.pro.access.log;
    error_log /var/log/nginx/2brain.pro.error.log;

    location / {
        proxy_pass http://127.0.0.1:8460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 127.0.0.1:10444 ssl http2;
    listen [::1]:10444 ssl http2;
    server_name www.2brain.pro;

    ssl_certificate /etc/letsencrypt/live/2brain.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2brain.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://2brain.pro$request_uri;
}
